name: Build KrishiMart Native Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Free Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21 (Required by Capacitor / Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install frontend dependencies & build React app
        working-directory: frontend
        run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Grant execute permission for Gradle
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload KrishiMart Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KrishiMart-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build Free iOS IPA (Unsigned for Sideloadly / AltStore)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies & build React app
        working-directory: frontend
        run: |
          npm install
          npm run build
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Install CocoaPods if Podfile exists
        working-directory: frontend/ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build Unsigned iOS App
        working-directory: frontend/ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build CONFIGURATION_BUILD_DIR=build-out
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build CONFIGURATION_BUILD_DIR=build-out
          fi

      - name: Package Unsigned IPA
        working-directory: frontend/ios/App/build-out
        run: |
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r KrishiMart-iOS-Unsigned.ipa Payload

      - name: Upload KrishiMart iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: KrishiMart-iOS-IPA
          path: frontend/ios/App/build-out/KrishiMart-iOS-Unsigned.ipa